<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Project 001 nested structure test design</title>
  <desc id="desc">The frozen K562 development cohort contains 15,999 transcripts. Abundance, sequence, transcript architecture, identifiability, and measurement callability form the structure-blind C_QUALITY comparator. An independently measured in-vivo RNA structure feature is then added to form D_STRUCTURE, and held-out macro-F1 is compared.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#53656d"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { font-size: 28px; font-weight: 700; fill: #173b45; }
      .stage { font-size: 14px; font-weight: 700; letter-spacing: 1.7px; fill: #5b6c72; }
      .label { font-size: 20px; font-weight: 680; fill: #173b45; }
      .body { font-size: 16px; fill: #41565e; }
      .small { font-size: 14px; fill: #607278; }
      .chip { font-size: 15px; font-weight: 620; fill: #284851; }
    </style>
  </defs>

  <rect width="1400" height="780" fill="#f7f8f4"/>
  <rect x="28" y="28" width="1344" height="724" rx="28" fill="#ffffff" stroke="#d9e2df" stroke-width="2"/>
  <text x="70" y="85" class="sans heading">Project 001: test the increment, not just the association</text>
  <text x="70" y="116" class="sans body">Same frozen transcripts, same held-out folds, one prespecified structure addition</text>

  <!-- top cohort strip -->
  <rect x="70" y="151" width="1260" height="88" rx="20" fill="#e8f2ed" stroke="#72a08f" stroke-width="2"/>
  <circle cx="121" cy="195" r="27" fill="#c8ded4" stroke="#4f846f" stroke-width="3"/>
  <circle cx="117" cy="193" r="10" fill="#91b8a8"/>
  <text x="168" y="187" class="sans label">K562 frozen development cohort</text>
  <text x="168" y="214" class="sans body">15,999 transcripts with a fixed five-class workflow-observability outcome</text>
  <rect x="1037" y="173" width="254" height="45" rx="14" fill="#ffffff" stroke="#a9c7bb"/>
  <text x="1164" y="201" text-anchor="middle" class="sans chip">5 grouped held-out folds</text>

  <text x="78" y="284" class="sans stage">STRUCTURE-BLIND CONTROLS</text>
  <text x="745" y="284" class="sans stage">INDEPENDENT STRUCTURE INPUT</text>

  <!-- nested control model -->
  <rect x="70" y="310" width="604" height="318" rx="24" fill="#f4f8f7" stroke="#789aa1" stroke-width="2"/>
  <text x="102" y="352" class="sans label">C_QUALITY</text>
  <text x="102" y="378" class="sans small">strongest locked non-structure comparator</text>

  <rect x="104" y="408" width="246" height="70" rx="15" fill="#e7f0f3" stroke="#7ca3b2"/>
  <text x="227" y="438" text-anchor="middle" class="sans chip">Abundance + sequence</text>
  <text x="227" y="461" text-anchor="middle" class="sans small">length, GC, complexity</text>

  <path d="M350 443 h37" fill="none" stroke="#53656d" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="402" y="408" width="238" height="70" rx="15" fill="#e7f0f3" stroke="#7ca3b2"/>
  <text x="521" y="438" text-anchor="middle" class="sans chip">Architecture</text>
  <text x="521" y="461" text-anchor="middle" class="sans small">exons and isoforms</text>

  <path d="M521 478 v32" fill="none" stroke="#53656d" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="402" y="526" width="238" height="70" rx="15" fill="#e7f0f3" stroke="#7ca3b2"/>
  <text x="521" y="556" text-anchor="middle" class="sans chip">Identifiability</text>
  <text x="521" y="579" text-anchor="middle" class="sans small">uniqueness and ambiguity</text>

  <path d="M402 561 h-37" fill="none" stroke="#53656d" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="104" y="526" width="246" height="70" rx="15" fill="#e7f0f3" stroke="#7ca3b2"/>
  <text x="227" y="556" text-anchor="middle" class="sans chip">Measurement callability</text>
  <text x="227" y="579" text-anchor="middle" class="sans small">assay coverage control</text>

  <!-- plus -->
  <circle cx="711" cy="470" r="27" fill="#173b45"/>
  <path d="M698 470 h26 M711 457 v26" stroke="#fff" stroke-width="4" stroke-linecap="round"/>

  <!-- independent structure -->
  <rect x="756" y="310" width="285" height="318" rx="24" fill="#faf6fb" stroke="#a882b5" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="789" y="352" class="sans label">In-vivo RNA structure</text>
  <text x="789" y="379" class="sans small">independently measured input</text>

  <path d="M799 461 C824 410, 854 500, 883 452 C908 410, 939 499, 974 451 C992 426, 1009 451, 990 489 C971 526, 905 516, 920 468 C932 429, 974 429, 1001 463" fill="none" stroke="#8a5d9f" stroke-width="7" stroke-linecap="round"/>
  <circle cx="799" cy="461" r="6" fill="#8a5d9f"/>
  <circle cx="1001" cy="463" r="6" fill="#8a5d9f"/>

  <rect x="789" y="546" width="220" height="52" rx="13" fill="#ffffff" stroke="#d7c6dd"/>
  <text x="899" y="568" text-anchor="middle" class="sans small">Not inferred from the</text>
  <text x="899" y="587" text-anchor="middle" class="sans small">sequencing outcome</text>

  <path d="M1042 470 h48" fill="none" stroke="#53656d" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- D model and comparison -->
  <rect x="1107" y="310" width="223" height="154" rx="24" fill="#f1ebf4" stroke="#8a5d9f" stroke-width="2"/>
  <text x="1218" y="357" text-anchor="middle" class="sans label">D_STRUCTURE</text>
  <text x="1218" y="386" text-anchor="middle" class="sans body">C_QUALITY</text>
  <text x="1218" y="412" text-anchor="middle" class="sans body">+ structure</text>
  <text x="1218" y="440" text-anchor="middle" class="sans small">prespecified extension</text>

  <path d="M1218 465 v49" fill="none" stroke="#53656d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1107" y="530" width="223" height="98" rx="22" fill="#173b45"/>
  <text x="1218" y="566" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#ffffff">Does held-out</text>
  <text x="1218" y="591" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#ffffff">macro-F1 improve?</text>
  <text x="1218" y="614" text-anchor="middle" class="sans" font-size="13" fill="#d5e4e6">D_STRUCTURE - C_QUALITY</text>

  <!-- footer -->
  <rect x="70" y="670" width="1260" height="52" rx="16" fill="#f5f2e9" stroke="#d8cfb7"/>
  <text x="700" y="702" text-anchor="middle" class="sans body">Primary metric, uncertainty, negative controls, sensitivity analysis, and decision rules were locked before structure access.</text>
</svg>
