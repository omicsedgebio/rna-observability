<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">RNA Observability biological overview</title>
  <desc id="desc">A schematic K562 human leukemia cell produces RNA transcripts that differ in abundance, sequence, architecture, identifiability, and folding. The same transcript population enters Illumina short-read and ONT direct-RNA workflows, leading to five conceptual workflow-specific observability outcomes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#52636f"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { font-size: 28px; font-weight: 700; fill: #173b45; }
      .stage { font-size: 14px; font-weight: 700; letter-spacing: 1.8px; fill: #53666d; }
      .label { font-size: 19px; font-weight: 650; fill: #173b45; }
      .body { font-size: 16px; fill: #42575f; }
      .small { font-size: 14px; fill: #5d6f75; }
      .outcome { font-size: 15px; font-weight: 650; fill: #263f47; }
    </style>
  </defs>

  <rect width="1400" height="800" fill="#f7f8f4"/>
  <rect x="28" y="28" width="1344" height="744" rx="28" fill="#ffffff" stroke="#d9e2df" stroke-width="2"/>

  <text x="70" y="88" class="sans heading">From a K562 cell to workflow-specific transcript observability</text>
  <text x="70" y="120" class="sans body">One transcript population, measured through two different workflows</text>

  <text x="72" y="176" class="sans stage">01  BIOLOGICAL CONTEXT</text>
  <text x="465" y="176" class="sans stage">02  TRANSCRIPTS DIFFER</text>
  <text x="835" y="176" class="sans stage">03  WORKFLOWS AND OUTCOMES</text>

  <!-- K562 cell schematic -->
  <circle cx="245" cy="385" r="154" fill="#e7f2ec" stroke="#3f7c68" stroke-width="5"/>
  <circle cx="235" cy="383" r="67" fill="#c9ddd4" stroke="#5f8f7f" stroke-width="3"/>
  <circle cx="220" cy="366" r="12" fill="#8fb7a8"/>
  <circle cx="262" cy="404" r="9" fill="#8fb7a8"/>
  <circle cx="172" cy="305" r="8" fill="#b4d1c5"/>
  <circle cx="313" cy="320" r="7" fill="#b4d1c5"/>
  <circle cx="162" cy="452" r="7" fill="#b4d1c5"/>
  <circle cx="317" cy="470" r="9" fill="#b4d1c5"/>

  <!-- RNA strands inside cell -->
  <path d="M125 357 C145 329, 172 390, 194 354 S235 326, 252 352" fill="none" stroke="#8a5d9f" stroke-width="6" stroke-linecap="round"/>
  <circle cx="125" cy="357" r="5" fill="#8a5d9f"/>
  <path d="M256 288 C278 315, 298 272, 330 306 S349 346, 365 331" fill="none" stroke="#8a5d9f" stroke-width="6" stroke-linecap="round"/>
  <circle cx="365" cy="331" r="5" fill="#8a5d9f"/>
  <path d="M137 488 C166 456, 196 518, 228 480 S284 455, 324 493" fill="none" stroke="#5f76a8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="137" cy="488" r="5" fill="#5f76a8"/>

  <rect x="89" y="578" width="312" height="78" rx="16" fill="#f0f6f2" stroke="#a8c8ba"/>
  <text x="245" y="608" text-anchor="middle" class="sans label">K562 human leukemia cell</text>
  <text x="245" y="636" text-anchor="middle" class="sans small">schematic scientific representation</text>

  <!-- Flow from cell to transcript properties -->
  <path d="M405 386 C430 386, 438 386, 457 386" fill="none" stroke="#52636f" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Transcript property field -->
  <rect x="480" y="220" width="300" height="390" rx="24" fill="#faf8fc" stroke="#d7c8df" stroke-width="2"/>
  <text x="630" y="259" text-anchor="middle" class="sans label">RNA molecules vary</text>

  <g class="sans body">
    <circle cx="520" cy="307" r="18" fill="#e8dced"/>
    <circle cx="560" cy="307" r="11" fill="#cbb3d5"/>
    <circle cx="593" cy="307" r="7" fill="#a986b7"/>
    <text x="626" y="313">abundance</text>

    <path d="M506 372 h92" stroke="#5f76a8" stroke-width="6" stroke-linecap="round"/>
    <path d="M506 358 h48" stroke="#5f76a8" stroke-width="6" stroke-linecap="round"/>
    <text x="626" y="374">length</text>

    <rect x="504" y="415" width="30" height="16" rx="4" fill="#4f8196"/>
    <rect x="548" y="415" width="20" height="16" rx="4" fill="#4f8196"/>
    <rect x="582" y="415" width="30" height="16" rx="4" fill="#4f8196"/>
    <path d="M534 423 h14 M568 423 h14" stroke="#4f8196" stroke-width="3"/>
    <text x="626" y="429">exons and isoforms</text>

    <text x="504" y="487" font-size="15" font-weight="700" fill="#7a657f">A C G U G C</text>
    <text x="626" y="487">sequence and GC</text>

    <path d="M506 542 C525 510, 550 570, 570 536 C590 502, 607 541, 597 565 C584 590, 537 577, 546 548 C554 523, 585 519, 603 545" fill="none" stroke="#8a5d9f" stroke-width="5" stroke-linecap="round"/>
    <text x="626" y="551">physical folding</text>
  </g>
  <text x="630" y="593" text-anchor="middle" class="sans small">Identifiability and callability also vary</text>

  <!-- split to workflows -->
  <path d="M782 386 C815 386, 806 294, 844 294" fill="none" stroke="#52636f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M782 386 C815 386, 806 486, 844 486" fill="none" stroke="#52636f" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- workflow cards -->
  <rect x="862" y="222" width="236" height="145" rx="20" fill="#e8f1f5" stroke="#5a879b" stroke-width="2"/>
  <text x="980" y="255" text-anchor="middle" class="sans label">Illumina short-read</text>
  <text x="980" y="281" text-anchor="middle" class="sans small">frozen RNA-seq workflow</text>
  <g stroke="#4f8196" stroke-width="6" stroke-linecap="round">
    <path d="M905 318 h40"/><path d="M960 318 h26"/><path d="M1002 318 h52"/>
    <path d="M920 338 h31"/><path d="M969 338 h48"/><path d="M1032 338 h23"/>
  </g>

  <rect x="862" y="414" width="236" height="145" rx="20" fill="#f1ebf4" stroke="#8a5d9f" stroke-width="2"/>
  <text x="980" y="447" text-anchor="middle" class="sans label">ONT direct RNA</text>
  <text x="980" y="473" text-anchor="middle" class="sans small">frozen direct-RNA workflow</text>
  <rect x="962" y="496" width="36" height="42" rx="13" fill="#d8c8df" stroke="#8a5d9f" stroke-width="3"/>
  <path d="M900 517 C925 488, 944 549, 973 517 C1000 486, 1020 546, 1060 513" fill="none" stroke="#8a5d9f" stroke-width="5" stroke-linecap="round"/>

  <!-- workflow arrows to outcomes -->
  <path d="M1100 294 C1121 294, 1114 334, 1136 334" fill="none" stroke="#5a879b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1100 486 C1121 486, 1114 418, 1136 418" fill="none" stroke="#8a5d9f" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- outcomes -->
  <rect x="1150" y="218" width="176" height="340" rx="22" fill="#fbfcfa" stroke="#cbd6d2" stroke-width="2"/>
  <text x="1238" y="252" text-anchor="middle" class="sans label">Examples</text>

  <g class="sans outcome">
    <circle cx="1179" cy="294" r="9" fill="#4f8196"/>
    <circle cx="1190" cy="294" r="9" fill="#8a5d9f" fill-opacity="0.82"/>
    <text x="1210" y="300">both</text>

    <circle cx="1184" cy="347" r="10" fill="#4f8196"/>
    <path d="M1178 347 h12" stroke="#fff" stroke-width="2"/>
    <text x="1210" y="353">Illumina mainly</text>

    <circle cx="1184" cy="400" r="10" fill="#8a5d9f"/>
    <path d="M1178 400 h12" stroke="#fff" stroke-width="2"/>
    <text x="1210" y="406">direct RNA mainly</text>

    <circle cx="1184" cy="453" r="10" fill="#d9dfdd" stroke="#7c8b8f" stroke-width="2"/>
    <text x="1210" y="459">neither</text>

    <circle cx="1184" cy="506" r="10" fill="#fff" stroke="#7c8b8f" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="1210" y="512">indeterminate</text>
  </g>

  <!-- question banner -->
  <rect x="455" y="676" width="866" height="66" rx="18" fill="#173b45"/>
  <text x="888" y="717" text-anchor="middle" class="sans" font-size="24" font-weight="700" fill="#ffffff">What explains workflow-specific transcript observability?</text>
</svg>
