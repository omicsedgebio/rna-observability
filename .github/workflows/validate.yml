name: Lightweight research repository validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight scientific test dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Validate documentation and metadata
        run: python scripts/validate_repository.py
      - name: Test governance failure cases
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
