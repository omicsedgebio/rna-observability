name: Lightweight research repository validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.12'
      - name: Install locked scientific test dependencies
        run: >-
          python -m pip install
          numpy==2.4.2 scipy==1.17.1 pandas==3.0.6
          scikit-learn==1.9.1 threadpoolctl==3.7.0 duckdb==1.5.5
          pyfaidx==0.9.0.4
      - name: Validate documentation and metadata
        run: python scripts/validate_repository.py
      - name: Test portable repository invariants
        run: |
          # The frozen deployment prediction fingerprint was created in the
          # canonical macOS/Apple Silicon environment. Reconstructing the same
          # transparent estimator state on Linux/x86_64 can differ in the final
          # floating-point bits even with identical Python/package versions.
          #
          # Keep the exact fingerprint test in the repository and omit only
          # that test from hosted Linux CI. All frozen artifact hashes remain
          # checked by the external-validation lock tests.
          python - <<'PYTEST'
          import unittest

          excluded = (
              "test_model_c_deployment.FrozenDeploymentTests."
              "test_saved_state_reconstructs_frozen_predictions"
          )

          discovered = unittest.defaultTestLoader.discover("tests")

          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item

          filtered = unittest.TestSuite()
          omitted = []

          for test in flatten(discovered):
              if test.id() == excluded:
                  omitted.append(test.id())
              else:
                  filtered.addTest(test)

          if omitted != [excluded]:
              raise SystemExit(
                  f"Expected exactly one platform-specific test to omit; got {omitted}"
              )

          print(
              "Linux CI omits only the canonical deployment prediction "
              "fingerprint reconstruction test."
          )
          print(
              "The frozen test remains tracked and is run in the canonical "
              "deployment environment."
          )

          result = unittest.TextTestRunner(verbosity=2).run(filtered)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PYTEST
      - name: Check whitespace
        run: git diff --check
