name: Lightweight research repository validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.12'
      - name: Install locked scientific test dependencies
        run: >-
          python -m pip install
          numpy==2.4.2 scipy==1.17.1 pandas==3.0.6
          scikit-learn==1.9.1 threadpoolctl==3.7.0 duckdb==1.5.5
          pyfaidx==0.9.0.4
      - name: Validate documentation and metadata
        run: python scripts/validate_repository.py
      - name: Test governance failure cases
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
